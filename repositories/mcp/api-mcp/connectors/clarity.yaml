name: clarity
description: "Microsoft Clarity Data Export — behaviour the page-view counters cannot see: dead clicks, rage clicks, excessive scrolling, quick-backs and JS errors, broken down by page, source, device or country. Free and unlimited on the recording side; this API is the machine-readable summary of it."
base: https://www.clarity.ms/export-data/api/v1
docs: https://learn.microsoft.com/en-us/clarity/setup-and-installation/clarity-data-export
free: "free with a Clarity project; 10 API requests per project per day, at most 3 days of history per call"
rate_limit: "10/day"
cache: "6h"
auth:
  type: bearer
  token: $secret:clarity_api_token
setup:
  - "Clarity → Settings → Data Export → Generate new API token (a long JWT)."
  - "Run: api secrets set clarity_api_token <token>"
  - The token is scoped to one project; a second project needs a second token.

notes:
  - "Hard limit of 10 calls per day per project. Cache aggressively and pull once a day, not per question — an eleventh call returns an error, not a truncated answer."
  - "`numOfDays` accepts 1, 2 or 3 only. There is no way to pull an older window through this API; anything longer has to be accumulated by storing the daily pulls."
  - "Metrics arrive as one object per metric name, each with its own `information` array — the projection below flattens the common shape, and `raw` keeps whatever else came back."

endpoints:
  insights:
    description: "Live project metrics for the last 1-3 days: sessions, bot traffic, engagement, and the frustration signals (dead clicks, rage clicks, quick-backs, script errors)."
    path: /project-live-insights
    params:
      numOfDays:
        description: "Days of history: 1, 2 or 3. Nothing older is available through this API."
        type: number
        default: 3
        enum: ["1", "2", "3"]
      dimension1:
        description: "Break the numbers down by one of: OS, Browser, Device, Country, Source, Medium, Campaign, Channel, URL."
        example: URL
      dimension2:
        description: A second breakdown dimension.
      dimension3:
        description: A third breakdown dimension.
    result:
      items: $
      fields:
        metric: $.metricName
        rows: $.information
    example: 'call_api(api: "clarity", endpoint: "insights", params: {numOfDays: 3, dimension1: "URL"})'
    notes: "Without a dimension you get project totals. With `dimension1: URL` you get the same metrics per page, which is how you find the program pages people bounce off."
